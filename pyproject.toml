[project]
name = "jev-101"
version = "0.1.0"
description = "Getting started with Discriminative (Jev/DiffusionGemma) models: a one-hour workshop lab on discriminative (System One) decision models, with Gemini and ADK"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7",
    "google-adk>=2.9",
    "google-genai>=1.0",
]

[tool.uv]
package = false
