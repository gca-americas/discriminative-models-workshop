slug: the-workflow
title: Combine models in an ADK workflow
kicker: Step 6
part: build
minutes: 12
color: emerald
summary: Build an ADK graph workflow where a decision model fights, Gemini Decisions reads the spell card beside it, and Gemini writes the tale.

parts:
  - id: a
    label: Design
    headline: Workflow design
    body: a-the-shape.md

  - id: b
    label: Implementation
    headline: Read the card, run the loop
    body: b-the-code.md
    exercises:
      card:
        title: Read a spell card
        intro: >
          `branches/read_card.py` reads one spell card with Gemini Decisions,
          as a small workflow of its own. Add the two missing parts, then run
          it.
        tasks:
        - kind: assemble
          id: card-question
          title: Ask about the color
          file: branches/read_card.py
          symbols:
          - QUESTIONS
          explain: >
            The three shape questions are already there. Build the
            `"element"` question: its type, and the options the model chooses
            from. Then check and save.
          template: |
            QUESTIONS = {
                "element": {
                    {{kind}}
                    "instructions": "What color is this spell card? The color is its element.",
                    {{criteria}}
                },
                "first": shape_question("first", "left"),
                "second": shape_question("second", "middle"),
                "third": shape_question("third", "right"),
            }
          slots:
            kind:
              answer: [choice]
              one: true
              label: the kind of question
            criteria:
              answer: [elements]
              one: true
              label: the options the model chooses from
          pieces:
          - id: choice
            code: '"type": "choice",'
          - id: noul
            code: '"type": "noul",'
            why: >
              A Noul answers yes or no. The card has one of four elements, so
              this is a Choice.
          - id: elements
            code: '"criteria": ELEMENTS,'
          - id: shapes
            code: '"criteria": SHAPES,'
            why: >
              `SHAPES` describes the eight shapes. This question is about the
              color, and `ELEMENTS` maps each color to its element.
          - id: quoted
            code: '"criteria": "ELEMENTS",'
            why: >
              In quotes, `"ELEMENTS"` is the word itself, not the dict of four
              elements. Use the variable without quotes.
          hints:
          - Picking one of four elements is a `choice` question.
          - The criteria are the options. `ELEMENTS` describes each one by its color.
          context: |
            ELEMENTS = {
                "fire": "The card is red-orange.",
                "frost": "The card is light blue.",
                "earth": "The card is green.",
                "storm": "The card is purple.",
            }
        - kind: assemble
          id: card-image
          title: Send the image
          file: branches/read_card.py
          symbols:
          - read_card
          explain: >
            `read_card` calls Gemini Decisions with the questions, but its
            `input` is empty. Drag in the block that sends the card, then check
            and save.
          template: |
            async def read_card(ctx: Context, node_input) -> Event:
                """Send the spell card to Gemini Decisions and ask what is on it."""
                png = CARD.read_bytes()
                client = genai.Client(api_key=os.environ["GEMINI_API_KEY"], http_options={"api_version": "v1beta"})
                started = time.perf_counter()
                result = await client.aio.decisions.create(
                    model="gemini-decision-1",
                    input=[
                        {{image}}
                    ],
                    questions=QUESTIONS,
                )
                ms = round((time.perf_counter() - started) * 1000)
                reading = {name: {"choice": result.answers[name].choice,
                                  "confidence": round(result.answers[name].confidence, 2)}
                           for name in QUESTIONS}
                return Event(output=reading, state={"reading": reading, "ms": ms,
                                                    "tokens": result.usage.total_input_tokens})
          slots:
            image:
              answer: [bytes]
              one: true
              label: the card itself, as a block the model can see
          pieces:
          - id: bytes
            code: '{"type": "image", "mime_type": "image/png", "data": base64.b64encode(png).decode()},'
          - id: text
            code: '{"type": "text", "text": "spell_card.png"},'
            why: >
              That sends the file's name as text. The model cannot open a file
              on this machine; it needs the image itself.
          - id: uri
            code: '{"type": "image", "mime_type": "image/png", "uri": "spell_card.png"},'
            why: >
              A `uri` has to be a web address the API can fetch. The card is a
              local file, already read into `png`, so send its bytes as `data`.
          hints:
          - The block's type is `image`, and the card is already read into `png`.
          - Image bytes travel as base64 text in `data`, with the `mime_type` that says what they are.
        - kind: terminal
          id: card-run
          title: Read the card
          expect:
          - python3 branches/read_card.py
          explain: >
            Choose a spell card, then run `python3 branches/read_card.py`. It
            prints the four answers with their confidence, the card's real
            answer, and whether they match. Choose another card and run it
            again.
          cards: true
          showFile: branches/read_card.py
      loop:
        title: Run the fight loop
        intro: >
          `branches/fight_loop.py` is the loop as a small workflow of its own:
          a list of moves, your decision model, and a route. Assemble its
          `tick`, then run it.
        tasks:
        - kind: assemble
          id: loop-tick
          title: Assemble tick
          file: branches/fight_loop.py
          symbols:
          - tick
          explain: >
            `tick` takes the next move, asks the model which response is
            right, reads the answer, and picks the next edge. `ask_async` is
            the workshop's helper: it takes the same arguments for every
            model. Drag the pieces into the slots, then check and save.
          template: |
            async def tick(ctx: Context, node_input) -> Event:
                """One move, one decision, then pick the next edge."""
                number = int(ctx.state.get("tick", 0)) + 1
                move = MOVES[number - 1]

                started = time.perf_counter()
                answered = await {{call}}
                    {{request}}
                )
                ms = round((time.perf_counter() - started) * 1000)
                response = {{answer}}
                decision = {"tick": number, "move": move, "action": response.choice,
                            "confidence": round(response.confidence, 2), "ms": ms,
                            "model": answered.model, "sdk": answered.sdk}

                {{over}}

                {{route}}

                return Event(output=decision, route=route,
                             state={"tick": number, "decisions": [*ctx.state.get("decisions", []), decision]})
          context: |
            QUESTIONS = {
                "response": {
                    "type": "choice",
                    "instructions": "The opponent has just done this. What is the right response?",
                    "criteria": RESPONSES,
                },
            }
          slots:
            call:
              answer: [call]
              one: true
              label: the call that asks the decision model
            request:
              answer: [about, questions]
              label: what the model judges, and the questions about it
            answer:
              answer: [choice]
              one: true
              label: the model's answer to the "response" question
            over:
              answer: [over]
              one: true
              label: true when this tick played the last move
            route:
              answer: [route]
              one: true
              label: 'the edge to take next: "next" or "done"'
          pieces:
          - id: call
            code: ask_async(
          - id: about
            code: 'about={"opponent": OPPONENT, "telegraph": move},'
          - id: questions
            code: questions=QUESTIONS,
          - id: choice
            code: answered.answers["response"]
          - id: over
            code: over = number >= len(MOVES)
          - id: route
            code: route = "done" if over else "next"
          - id: chat
            code: 'messages=[{"role": "user", "content": move}],'
            why: >
              A decision model does not take a chat. It takes what to judge
              and the questions about it.
          - id: raw-input
            code: input=move,
            why: >
              `input` is the Google Gen AI SDK's own name for it, and `state`
              is the TypeSafe SDK's. `ask_async` takes `about` for every model
              and passes it on under the right name.
          - id: adk-state
            code: 'state=ctx.state,'
            why: >
              `ctx.state` is the workflow's shared state: the tick counter and
              the decisions so far. The model judges the move, passed as
              `about`.
          - id: exposed
            code: answered.answers["exposed"]
            why: >
              This tick asks one question, named `"response"`. Answers come
              back under the name of the question.
          - id: past
            code: over = number > len(MOVES)
            why: >
              `number` counts from 1, so the last move is `number ==
              len(MOVES)`. With `>`, the loop asks for a move that does not
              exist.
          - id: never
            code: route = "next"
            why: 'Always `"next"` never ends: after the last move the loop needs `"done"`.'
          hints:
          - 'The call is `ask_async`, and it takes two arguments: `about`, what the model judges, and `questions`, already defined above tick as `QUESTIONS`.'
          - >
            The answer is under the question's name, `"response"`. `over` is
            true on the last move, when `number` equals `len(MOVES)`, and then
            the route is `"done"`.
        - kind: terminal
          id: loop-run
          title: Run the loop
          expect:
          - python3 branches/fight_loop.py
          explain: >
            It prints the model and SDK that answered, then one line per
            tick: the move, the model's response, its confidence and how long
            the call took. All five moves should play.

    checks:
    - id: card-read
      label: The spell card is read correctly
      probe: python3 branches/read_card.py
      assert: contains
      value: "right: element ✓, shapes 3 of 3"
      hint: >
        Add the "element" question and the image block above, check and save
        each, then run the script. If the reading is wrong, look at what the
        script printed for each answer.
    - id: loop-plays
      label: The fight loop plays every move
      probe: python3 branches/fight_loop.py
      assert: contains
      value: "5 of 5 moves played"
      hint: >
        Assemble tick above, check and save, then run the script. If it stops
        early, check the route tick returns on the last move.

  - id: c
    label: Graph
    headline: Run the workflow
    body: c-graph.md
    exercise:
      title: Start the workflow
      intro: Update the game to workflow mode and look at what it adds. Then start
        the workflow in the arena.
      tasks:
      - kind: files
        id: workflow-files
        title: Update the game and review the changes
        open: app/mode_workflow.py
        only:
        - app/
        - agents/
        added:
        - agents/arena/agent.py
        - agents/arena/__init__.py
        stage: 6
        compare: 5
        explain: 'If the bar says the game is in Discriminative model mode, press
          "Update game to workflow mode". The files marked NEW are what this step
          adds to the game: `mode_workflow.py` starts the ADK workflow and receives
          its moves and card readings, and `static/modes/workflow.js` draws them
          on the page. Open `main.py` and `static/app.js` to see the highlighted
          lines that load them. The workflow itself is `agents/arena/agent.py`,
          also marked NEW: the nodes and the graph from parts b and c, which
          `mode_workflow.py` runs.'
        highlight: HERE\.glob\("mode_\*\.py"\)|import_module\(path\.stem\)|^PLUGINS
          = load_plugins|^MODES = |loadScript\(`modes/
        highlightLabel: main.py and static/app.js do not change in this step. Their
          highlighted lines load every mode_*.py and modes/*.js they find, which is
          how the new files are picked up.
      - kind: app
        id: watch
        title: Arena app
        appTitle: Arena
        explain: 'The arena opens in "Workflow fights". Press Start. Watch the
          spell card in the corner: the workflow reads it while the fight goes on,
          the tag says SPELL READY, and the fighter casts on the next opening.
          Then a new card appears and the workflow reads that one. Under the ring, the SPELL
          CARD panel shows what Gemini Decisions answered for the color and
          each shape, with its confidence. The REFLEX panel below it shows the
          fight''s answers, as in step 5. When the fight ends, THE TALE panel
          shows what Gemini wrote. Restart runs a fresh fight.'
        appMode: workflow
    checks:
    - id: workflow-mode
      label: The app has the workflow fight
      probe: curl -s http://127.0.0.1:$APP_PORT/api/health
      assert: contains
      value: '"id": "workflow"'
      hint: Press "Update game to workflow mode" in the file explorer above.
    - id: gemini-ready
      label: Gemini API key is set
      probe: python3 scripts/check_setup.py
      assert: not_contains
      value: gemini          not set up
      hint: Go back to step 2, paste a Gemini API key, and press Set up.
    - id: arena-runs
      label: Workflow completed a match
      probe: curl -s http://127.0.0.1:$APP_PORT/api/fight
      assert: matches
      value: '"mode": "workflow".*"over": true'
      hint: Press Start in the arena app above, in Workflow fights, and let the match
        end. This reads the fight on the arena's screen. The fight needs your
        decision model and the Gemini API key. If it stops early, check the two
        lights at the top right.
    exercises:
      gemini:
        title: Verify the Gemini API key
        tasks:
        - kind: terminal
          id: check
          title: Verify the Gemini API key
          expect:
          - python3 scripts/check_setup.py
          explain: Run `python3 scripts/check_setup.py`. The `gemini` line shows
            the key the workflow will use, with most of it hidden. If it says
            `not set up`, go back to step 2, paste a Gemini API key, and press
            Set up.
