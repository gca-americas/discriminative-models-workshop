slug: run-it
title: Set up the model
kicker: Step 2
part: run
minutes: 8
color: violet
summary: Choose the model the workshop uses and configure access to it.

parts:
  - id: a
    label: Setup
    headline: Configure access
    body: a-setup.md
    exercise:
      title: Prepare your environment
      intro: >
        Choose the model the workshop uses. The setup checks your choice before
        it keeps it. If it does not work, it is marked and the next model is
        selected for you to try.
      tasks:
        - kind: model-setup
          id: model
          title: Choose the decision model
          explain: >
            Jev needs a TypeSafe API key. DiffusionGemma needs a Google Cloud
            project with billing and GPU quota. Gemini Decisions needs a
            Gemini API key. Enter the Gemini API key whichever model you
            choose, because step 6 uses it.
    checks:
      - id: jev-ready
        label: Model endpoint is reachable
        probe: python3 scripts/check_setup.py
        assert: contains
        value: "model: ready"
        hint: >
          Choose the decision model above and press Set up.
      - id: gemini-key
        label: Gemini API key is set
        probe: python3 scripts/check_setup.py
        assert: not_contains
        value: gemini          not set up
        hint: >
          Paste a Gemini API key into the field above and press Set up. Create
          one at https://aistudio.google.com/apikey.
